<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, responsive to-do list application">
    <title>Modern To-Do App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-tasks"></i> My Tasks</h1>
                <p class="date-display" id="dateDisplay"></p>
            </div>
        </header>

        <!-- INPUT AREA -->
        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    id="taskInput" 
                    type="text" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                    aria-label="Task input"
                >
                <button id="addBtn" aria-label="Add task">
                    <i class="fas fa-plus"></i> Add
                </button>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Active:</span>
                <span class="stat-value" id="activeCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Completed:</span>
                <span class="stat-value" id="completedCount">0</span>
            </div>
        </div>

        <!-- TASK LIST -->
        <ul id="taskList" class="task-list"></ul>

        <!-- EMPTY STATE -->
        <div id="emptyState" class="empty-state">
            <i class="fas fa-clipboard-list"></i>
            <p>No tasks yet. Add one to get started!</p>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-buttons">
            <button id="clearCompletedBtn" class="btn-secondary" aria-label="Clear completed tasks">
                <i class="fas fa-trash"></i> Clear Completed
            </button>
            <button id="clearAllBtn" class="btn-danger" aria-label="Clear all tasks">
                <i class="fas fa-broom"></i> Clear All
            </button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
